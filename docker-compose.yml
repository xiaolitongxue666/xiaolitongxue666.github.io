services:
  goatcounter:
    image: arp242/goatcounter:latest
    command:
      [
        "serve",
        "-listen",
        ":8080",
        "-tls",
        "none",
        "-base-path",
        "/analytics",
        "-db",
        "sqlite+/home/goatcounter/db/goatcounter.sqlite3",
      ]
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - goatcounter-db:/home/goatcounter/db
    environment:
      GOATCOUNTER_DB: sqlite+/home/goatcounter/db/goatcounter.sqlite3
    restart: unless-stopped

  blog:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  goatcounter-db:
