# ---------------- #
#   Main Configs   #
# ---------------- #
# 修改 permalink/url/plugins 会影响全部历史文章 URL，变更前必读 docs/TROUBLESHOOTING.md
baseurl:
url: https://xiaolitongxue666.github.io/
date_format: "ordinal"
title: xiaolitongxue666 Blog
description: 技术分享与学习笔记 - 专注于编程、系统架构和开发工具
author:
  name: xiaolitongxue666
  email:
  bio: 软件开发工程师
  avatar: /assets/images/avatar.jpg
  github: xiaolitongxue666

# SEO 设置（jekyll-seo-tag 插件读取）
seo:
  type: Person
  name: xiaolitongxue666
  links:
    - https://github.com/xiaolitongxue666

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
paginate: 10
paginate_path: "/page:num/"
permalink: /:year/:month/:day/:title/
plugins:
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jekyll-seo-tag
    - jemoji
collections:
    wiki:
        output: true
        permalink: /wiki/:path/
