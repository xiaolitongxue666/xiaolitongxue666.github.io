name: Jekyll Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Setup Node.js for E2E
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run direct publish E2E
        run: node .github/scripts/e2e/run-publish-e2e.js

      - name: Upload E2E site artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-publish-site
          path: .e2e-staging/_site-e2e
          if-no-files-found: error
