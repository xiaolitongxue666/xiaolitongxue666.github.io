# Local edge: mirrors vps_nginx /blog/ + /analytics/ + theme exact locations.
# Upstream service names are compose DNS (blog, goatcounter).

server {
    listen 80;
    server_name 127.0.0.1 localhost;

    client_max_body_size 20m;

    location /blog/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # No URI suffix — keep /blog/ prefix for the blog container rewrite.
        proxy_pass http://blog:80;
    }

    # GoatCounter — keep /analytics/ URI; sub_filter order matches production.
    location /analytics/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://goatcounter:8080;
        sub_filter_once on;
        sub_filter '</head>' '<script id="blog-stats-theme-boot">(function(){try{var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script><link rel="stylesheet" href="/css/analytics-blog-theme.css" id="blog-stats-embed"><script src="/js/analytics-theme.js" id="blog-stats-theme-js"></script></head>';
    }

    location = /css/analytics-blog-theme.css {
        root /usr/share/nginx/html;
        default_type text/css;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /js/analytics-theme.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 404;
    }
}
